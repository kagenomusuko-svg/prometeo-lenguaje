name: Prometeo language boundary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout contexto
        uses: actions/checkout@v7
        with:
          repository: kagenomusuko-svg/prometeo-contexto
          ref: 199bd93f9c5680742606d5861d6f70bc12dd8a01
          path: prometeocontexto
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --ignore-scripts
      - name: Run language contract and adversarial suite
        env:
          PROMETEO_CONTEXTO_PATH: ${{ github.workspace }}/prometeocontexto/src/query.mjs
        run: npm test
